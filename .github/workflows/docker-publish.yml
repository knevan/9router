name: Build and Push Docker Image

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "vX.Y.Z tag to publish (leave empty to auto-detect upstream latest)"
        required: false
        default: ""
        type: string
      promote_latest:
        description: "Promote this republish to latest"
        required: false
        default: true
        type: boolean
      force_build:
        description: "Force rebuild even if image already exists in GHCR"
        required: false
        default: false
        type: boolean

# Keep every release in one FIFO queue.
concurrency:
  group: docker-publish-${{ github.repository }}
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: decolua/9router
  UPSTREAM_REPO: decolua/9router

jobs:
  prepare:
    name: Validate and prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write

    outputs:
      should_build: ${{ steps.release.outputs.should_build }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      publish_dockerhub: ${{ steps.release.outputs.publish_dockerhub }}
      promote_latest: ${{ steps.release.outputs.promote_latest }}
      ghcr_image: ${{ steps.release.outputs.ghcr_image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag and validate
        id: release
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
          PROMOTE_LATEST_INPUT: ${{ inputs.promote_latest != false && 'true' || 'false' }}
          FORCE_BUILD_INPUT: ${{ inputs.force_build && 'true' || 'false' }}
          REPOSITORY: ${{ github.repository }}
          UPSTREAM_REPO: ${{ env.UPSTREAM_REPO }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const { execFileSync } = require("child_process");
          const fs = require("fs");
          const https = require("https");

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              const req = https.get(url, {
                headers: {
                  "User-Agent": "GitHub-Actions-9router-Fork",
                  "Accept": "application/vnd.github.v3+json",
                  ...(process.env.GH_TOKEN ? { "Authorization": `token ${process.env.GH_TOKEN}` } : {})
                }
              }, res => {
                let data = "";
                res.on("data", chunk => data += chunk);
                res.on("end", () => {
                  try {
                    resolve({ status: res.statusCode, body: JSON.parse(data) });
                  } catch (e) {
                    reject(new Error(`Failed to parse JSON from ${url}: ${e.message} - Response: ${data}`));
                  }
                });
              });
              req.on("error", reject);
            });
          }

          async function main() {
            let tag = (process.env.INPUT_TAG || "").trim();
            const eventName = process.env.EVENT_NAME;
            const refName = process.env.GITHUB_REF_NAME;
            const refType = process.env.GITHUB_REF_TYPE;
            const upstream = process.env.UPSTREAM_REPO || "decolua/9router";
            const repository = process.env.REPOSITORY || "";
            const ghcrImage = `ghcr.io/${repository.toLowerCase()}`;
            const forceBuild = process.env.FORCE_BUILD_INPUT === "true";

            // If tag is not manually provided, check push ref or fetch from upstream
            if (!tag) {
              if (eventName === "push" && refType === "tag" && refName) {
                tag = refName;
              } else {
                console.log(`Fetching latest tags from upstream ${upstream}...`);
                const { status, body: tags } = await fetchJson(`https://api.github.com/repos/${upstream}/tags?per_page=10`);
                if (status !== 200 || !Array.isArray(tags) || tags.length === 0) {
                  throw new Error(`Failed to fetch tags from upstream (status ${status}): ${JSON.stringify(tags)}`);
                }
                const semverTag = tags.find(t => /^v\d+\.\d+\.\d+/.test(t.name));
                if (!semverTag) {
                  throw new Error(`No semver tag found in upstream ${upstream}`);
                }
                tag = semverTag.name;
                console.log(`Detected latest upstream tag: ${tag}`);
              }
            }

            const match = /^v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?)$/.exec(tag);
            if (tag.includes("+")) {
              console.error(`Build metadata is not supported in Docker release tags: ${tag}`);
              process.exit(1);
            }
            if (!match) {
              console.error(`Expected a Docker-safe semver tag like v0.5.81 or v0.5.81-rc.1, received: ${tag || "<empty>"}`);
              process.exit(1);
            }

            const version = match[1];

            // Check if image already exists in GHCR
            let imageExists = false;
            try {
              execFileSync("docker", ["manifest", "inspect", `${ghcrImage}:${version}`], { stdio: "pipe" });
              imageExists = true;
            } catch (err) {
              imageExists = false;
            }

            console.log(`GHCR image ${ghcrImage}:${version} exists: ${imageExists}`);

            if (imageExists && !forceBuild && eventName !== "push") {
              console.log(`Image ${ghcrImage}:${version} already exists in GHCR and force_build is false. Skipping build.`);
              const output = process.env.GITHUB_OUTPUT;
              fs.appendFileSync(output, `should_build=false\n`);
              fs.appendFileSync(output, `tag=${tag}\n`);
              fs.appendFileSync(output, `version=${version}\n`);

              const summary = process.env.GITHUB_STEP_SUMMARY;
              if (summary) {
                fs.appendFileSync(summary, `### ⏭️ Image already up to date\nImage \`${ghcrImage}:${version}\` already exists in GHCR. No build required.\n`);
              }
              return;
            }

            // Sync tag commit from upstream if needed
            try {
              execFileSync("git", ["remote", "add", "upstream", `https://github.com/${upstream}.git`], { stdio: "pipe" });
            } catch (_) {}

            console.log(`Fetching ref ${tag} from upstream...`);
            execFileSync("git", ["fetch", "upstream", `refs/tags/${tag}:refs/tags/${tag}`, "--force"], { stdio: "inherit" });

            const commit = execFileSync("git", ["rev-parse", `refs/tags/${tag}^{commit}`], { encoding: "utf8" }).trim();
            console.log(`Resolved tag ${tag} to commit ${commit}`);

            // Push tag to origin fork if not already present
            try {
              execFileSync("git", ["push", "origin", `refs/tags/${tag}`, "--force"], { stdio: "inherit" });
              console.log(`Successfully synced tag ${tag} to origin fork`);
            } catch (e) {
              console.log(`Note: could not push tag ${tag} to origin: ${e.message}`);
            }

            const publishDockerHub = repository === "decolua/9router";
            const isPrerelease = version.includes("-");
            const promoteLatest = (eventName === "push" && !isPrerelease) || process.env.PROMOTE_LATEST_INPUT === "true";

            const output = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(output, `should_build=true\n`);
            fs.appendFileSync(output, `tag=${tag}\n`);
            fs.appendFileSync(output, `version=${version}\n`);
            fs.appendFileSync(output, `commit=${commit}\n`);
            fs.appendFileSync(output, `publish_dockerhub=${publishDockerHub}\n`);
            fs.appendFileSync(output, `promote_latest=${promoteLatest}\n`);
            fs.appendFileSync(output, `ghcr_image=${ghcrImage}\n`);

            console.log(`Prepared build for ${tag} at ${commit}`);
            console.log(`latest promotion: ${promoteLatest ? "enabled" : "disabled"}`);
          }

          main().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      GHCR_IMAGE: ${{ needs.prepare.outputs.ghcr_image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out release source at validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          path: source
          fetch-depth: 1

      - name: Auto-sync package.json version to release tag
        run: |
          node <<'NODE'
          const fs = require("fs");
          const ver = process.env.APP_VERSION;
          for (const file of ["source/package.json", "source/cli/package.json"]) {
            if (fs.existsSync(file)) {
              const data = JSON.parse(fs.readFileSync(file, "utf8"));
              if (data.version !== ver) {
                console.log(`Auto-syncing ${file}: ${data.version} -> ${ver}`);
                data.version = ver;
                fs.writeFileSync(file, JSON.stringify(data, null, 2) + "\n");
              }
            }
          }
          NODE
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}

      - name: Check out publishing Dockerfile
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow
          sparse-checkout: |
            Dockerfile
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: source
          file: workflow/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
            ALPINE_MIRROR=${{ vars.ALPINE_MIRROR || 'dl-cdn.alpinelinux.org' }}
            NPM_REGISTRY=${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org/' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=9router-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=9router-${{ matrix.suffix }}
          provenance: false
          sbom: false

      - name: Smoke-test platform image before publishing digest artifact
        env:
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -Eeuo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          container="9router-platform-smoke-${GITHUB_RUN_ID}-${{ matrix.suffix }}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          docker run --detach \
            --name "$container" \
            --platform "$PLATFORM" \
            --publish 20128:20128 \
            "${GHCR_IMAGE}@${IMAGE_DIGEST}"

          for attempt in {1..45}; do
            if curl --fail --silent --show-error http://127.0.0.1:20128/api/health; then
              echo "${PLATFORM} health check passed"
              exit 0
            fi
            if (( attempt % 5 == 0 )); then
              echo "Waiting for ${PLATFORM} health check (${attempt}/45)" >&2
            fi
            sleep 2
          done

          echo "${PLATFORM} health check failed; container logs follow:" >&2
          docker logs "$container" || true
          exit 1

      - name: Save image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/digests/${{ matrix.suffix }}.txt"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.suffix }}
          path: ${{ runner.temp }}/digests/${{ matrix.suffix }}.txt
          if-no-files-found: error

  publish:
    name: Publish and verify manifest
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GHCR_IMAGE: ${{ needs.prepare.outputs.ghcr_image }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download platform digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and verify version manifest
        env:
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          digest_files=("$RUNNER_TEMP"/digests/*.txt)

          if [[ "${#digest_files[@]}" -ne 2 ]]; then
            echo "Expected two platform digests, found ${#digest_files[@]}" >&2
            exit 1
          fi

          sources=()
          for digest_file in "${digest_files[@]}"; do
            digest="$(tr -d '\n' < "$digest_file")"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid image digest in $digest_file: $digest" >&2
              exit 1
            fi
            sources+=("${GHCR_IMAGE}@${digest}")
          done

          docker buildx imagetools create \
            --tag "${GHCR_IMAGE}:${VERSION}" \
            "${sources[@]}"

          docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}" | tee "$RUNNER_TEMP/version-manifest.txt"
          docker buildx imagetools inspect --raw "${GHCR_IMAGE}:${VERSION}" > "$RUNNER_TEMP/version-manifest.json"

          expected=$'linux/amd64\nlinux/arm64'
          actual="$(jq -r '[.manifests[] | select(.platform != null and .platform.os != null and .platform.architecture != null) | "\(.platform.os)/\(.platform.architecture)"] | sort | .[]' "$RUNNER_TEMP/version-manifest.json")"
          if [[ "$actual" != "$expected" ]]; then
            echo "Version manifest platforms do not match exactly:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi

      - name: Smoke-test resolved version manifest
        env:
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -Eeuo pipefail
          container="9router-manifest-smoke-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          docker run --detach \
            --name "$container" \
            --platform linux/amd64 \
            --publish 20128:20128 \
            "${GHCR_IMAGE}:${VERSION}"

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:20128/api/health; then
              echo "Resolved version manifest health check passed"
              exit 0
            fi
            if (( attempt % 5 == 0 )); then
              echo "Waiting for resolved manifest health check (${attempt}/30)" >&2
            fi
            sleep 2
          done

          echo "Resolved version manifest health check failed; container logs follow:" >&2
          docker logs "$container" || true
          exit 1

      - name: Log in to Docker Hub
        if: needs.prepare.outputs.publish_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish version image to Docker Hub
        if: needs.prepare.outputs.publish_dockerhub == 'true'
        env:
          DOCKERHUB_IMAGE: ${{ env.DOCKERHUB_IMAGE }}
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${DOCKERHUB_IMAGE}:${VERSION}" \
            "${GHCR_IMAGE}:${VERSION}"

          docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${VERSION}" | tee "$RUNNER_TEMP/dockerhub-version-manifest.txt"
          docker buildx imagetools inspect --raw "${DOCKERHUB_IMAGE}:${VERSION}" > "$RUNNER_TEMP/dockerhub-version-manifest.json"

          expected=$'linux/amd64\nlinux/arm64'
          actual="$(jq -r '[.manifests[] | select(.platform != null and .platform.os != null and .platform.architecture != null) | "\(.platform.os)/\(.platform.architecture)"] | sort | .[]' "$RUNNER_TEMP/dockerhub-version-manifest.json")"
          if [[ "$actual" != "$expected" ]]; then
            echo "Docker Hub version manifest platforms do not match exactly:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi

      - name: Record latest promotion policy
        env:
          PROMOTE_LATEST: ${{ needs.prepare.outputs.promote_latest }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [[ "$PROMOTE_LATEST" == "true" ]]; then
            echo "### Latest promotion" >> "$GITHUB_STEP_SUMMARY"
            echo "- Policy: promote \`latest\` after the verified ${VERSION} manifest." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Latest promotion" >> "$GITHUB_STEP_SUMMARY"
            echo "- Policy: leave \`latest\` unchanged; this is a numbered-tag-only manual republish." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Promote verified version to latest
        if: needs.prepare.outputs.promote_latest == 'true'
        env:
          DOCKERHUB_IMAGE: ${{ env.DOCKERHUB_IMAGE }}
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          PUBLISH_DOCKERHUB: ${{ needs.prepare.outputs.publish_dockerhub }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --tag "${GHCR_IMAGE}:latest" \
            "${GHCR_IMAGE}:${VERSION}"

          if [[ "$PUBLISH_DOCKERHUB" == "true" ]]; then
            docker buildx imagetools create \
              --tag "${DOCKERHUB_IMAGE}:latest" \
              "${GHCR_IMAGE}:${VERSION}"
          fi

          docker buildx imagetools inspect "${GHCR_IMAGE}:latest" | tee "$RUNNER_TEMP/ghcr-latest-manifest.txt"
          docker buildx imagetools inspect --raw "${GHCR_IMAGE}:latest" > "$RUNNER_TEMP/ghcr-latest-manifest.json"

          expected=$'linux/amd64\nlinux/arm64'
          actual="$(jq -r '[.manifests[] | select(.platform != null and .platform.os != null and .platform.architecture != null) | "\(.platform.os)/\(.platform.architecture)"] | sort | .[]' "$RUNNER_TEMP/ghcr-latest-manifest.json")"
          if [[ "$actual" != "$expected" ]]; then
            echo "GHCR latest manifest platforms do not match exactly:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi

          if [[ "$PUBLISH_DOCKERHUB" == "true" ]]; then
            docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:latest" | tee "$RUNNER_TEMP/dockerhub-latest-manifest.txt"
            docker buildx imagetools inspect --raw "${DOCKERHUB_IMAGE}:latest" > "$RUNNER_TEMP/dockerhub-latest-manifest.json"
            actual="$(jq -r '[.manifests[] | select(.platform != null and .platform.os != null and .platform.architecture != null) | "\(.platform.os)/\(.platform.architecture)"] | sort | .[]' "$RUNNER_TEMP/dockerhub-latest-manifest.json")"
            if [[ "$actual" != "$expected" ]]; then
              echo "Docker Hub latest manifest platforms do not match exactly:" >&2
              printf '%s\n' "$actual" >&2
              exit 1
            fi
          fi

          {
            echo "### Published Docker images"
            echo "- GHCR: \`${GHCR_IMAGE}:${VERSION}\`"
            echo "- GHCR latest: \`${GHCR_IMAGE}:latest\`"
            if [[ "$PUBLISH_DOCKERHUB" == "true" ]]; then
              echo "- Docker Hub: \`${DOCKERHUB_IMAGE}:${VERSION}\`"
              echo "- Docker Hub latest: \`${DOCKERHUB_IMAGE}:latest\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
